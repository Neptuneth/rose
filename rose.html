<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090812">
  <title>A Rose for You</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #090812;
      --rose: #ee527b;
      --mint: #85d9a1;
      --cream: #f7e8d8;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 52%, rgba(96, 29, 65, .21), transparent 34%),
        radial-gradient(ellipse at 50% 100%, rgba(26, 68, 51, .16), transparent 40%),
        var(--night);
      color: var(--cream);
      font-family: Georgia, "Noto Serif Thai", serif;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      padding: 22px;
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      border: 1px solid rgba(248, 210, 220, .055);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .scene::before {
      width: min(76vw, 660px);
      aspect-ratio: 1;
      box-shadow: 0 0 100px rgba(149, 51, 91, .08), inset 0 0 100px rgba(149, 51, 91, .035);
    }

    .scene::after {
      width: min(64vw, 550px);
      aspect-ratio: 1;
      border-style: dashed;
      border-color: rgba(248, 210, 220, .04);
    }

    .stars {
      position: absolute;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: var(--size, 2px);
      height: var(--size, 2px);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: #ffe4e9;
      opacity: var(--alpha, .45);
      box-shadow: 0 0 9px 2px rgba(255, 190, 211, .35);
      animation: twinkle var(--speed, 3s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    .layout {
      display: flex;
      width: min(100%, 680px);
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: #d6abb8;
      font-family: "Segoe UI", "Noto Sans Thai", sans-serif;
      font-size: .73rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      animation: fade-up 1s .25s both;
    }

    h1 {
      margin: 0;
      color: #fff1e9;
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 400;
      letter-spacing: .025em;
      text-shadow: 0 0 28px rgba(238, 82, 123, .24);
      animation: fade-up 1.2s .35s both;
    }

    .rose-wrap {
      width: min(74vw, 430px);
      margin: -4px 0 -12px;
      filter: drop-shadow(0 18px 34px rgba(19, 7, 17, .45));
    }

    svg {
      display: block;
      width: 100%;
      overflow: visible;
    }

    .stem {
      fill: none;
      stroke: url(#stem-gradient);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 7;
      stroke-dasharray: 330;
      stroke-dashoffset: 330;
    }

    .stem-main { animation: draw-stem 1.65s .55s cubic-bezier(.4, 0, .2, 1) forwards; }
    .stem-detail {
      fill: none;
      stroke: rgba(224, 255, 199, .48);
      stroke-linecap: round;
      stroke-width: 1.6;
      stroke-dasharray: 310;
      stroke-dashoffset: 310;
      animation: draw-stem 1.55s .65s ease-out forwards;
    }

    .leaf {
      transform-box: view-box;
      opacity: 0;
      transform: scale(.08);
      transform-origin: var(--origin);
      animation: leaf-open .9s var(--delay) cubic-bezier(.2, .8, .25, 1.2) forwards;
    }

    .leaf-shape {
      fill: url(#leaf-gradient);
      stroke: #91e8a7;
      stroke-linejoin: round;
      stroke-width: 1.4;
    }

    .leaf-vein {
      fill: none;
      stroke: rgba(218, 255, 205, .7);
      stroke-linecap: round;
      stroke-width: 1.3;
    }

    .petal {
      transform-box: view-box;
      transform: scale(.04);
      transform-origin: 210px 222px;
      animation: petal-open 1.15s var(--delay) cubic-bezier(.18, .8, .22, 1.15) forwards;
    }

    .petal-shape {
      stroke: rgba(255, 188, 198, .58);
      stroke-width: 1.25;
      stroke-linejoin: round;
    }

    .outer-petal { fill: url(#outer-petal-gradient); }
    .middle-petal { fill: url(#middle-petal-gradient); }
    .inner-petal { fill: url(#inner-petal-gradient); }

    .petal-fold {
      fill: none;
      stroke: rgba(255, 207, 204, .55);
      stroke-linecap: round;
      stroke-width: 1.5;
    }

    .flower-center {
      transform-box: view-box;
      transform-origin: 210px 222px;
      transform: scale(0);
    }
    .center-1 { animation: center-open .65s 4.55s cubic-bezier(.2, .8, .2, 1.2) forwards; }
    .center-2 { animation: center-open .65s 4.7s cubic-bezier(.2, .8, .2, 1.2) forwards; }
    .center-3 { animation: center-open .65s 4.85s cubic-bezier(.2, .8, .2, 1.2) forwards; }

    .message {
      margin: 0;
      color: #e8c9ce;
      font-size: clamp(1.05rem, 3.5vw, 1.3rem);
      letter-spacing: .06em;
      opacity: 0;
      animation: fade-up 1.1s 5.15s forwards;
    }

    .message span {
      display: block;
      margin-top: 7px;
      color: #9c7d91;
      font-family: "Segoe UI", "Noto Sans Thai", sans-serif;
      font-size: .76rem;
      letter-spacing: .12em;
    }

    .replay {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 9px;
      margin-top: 24px;
      padding: 9px 17px;
      border: 1px solid rgba(237, 191, 207, .25);
      border-radius: 999px;
      background: rgba(255, 255, 255, .035);
      color: #e5c4d0;
      cursor: pointer;
      font: 500 .78rem "Segoe UI", "Noto Sans Thai", sans-serif;
      letter-spacing: .08em;
      opacity: 0;
      transition: border-color .25s, background .25s, transform .25s;
      animation: fade-up .8s 5.5s forwards;
    }

    .replay:hover {
      transform: translateY(-2px);
      border-color: rgba(237, 191, 207, .58);
      background: rgba(255, 255, 255, .08);
    }

    .replay:focus-visible {
      outline: 2px solid #ffc1d0;
      outline-offset: 4px;
    }

    .replay svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    .scene.replaying .stem-main,
    .scene.replaying .stem-detail {
      animation: none;
      stroke-dashoffset: 330;
    }

    .scene.replaying .leaf {
      animation: none;
      opacity: 0;
      transform: scale(.08);
    }

    .scene.replaying .petal {
      animation: none;
      transform: scale(.035);
    }

    .scene.replaying .flower-center {
      animation: none;
      transform: scale(0);
    }

    .scene.replaying .stem-main { animation: draw-stem 1.65s .12s cubic-bezier(.4, 0, .2, 1) forwards; }
    .scene.replaying .stem-detail { animation: draw-stem 1.55s .22s ease-out forwards; }
    .scene.replaying .leaf-left { animation: leaf-open .9s 1.8s cubic-bezier(.2, .8, .25, 1.2) forwards; }
    .scene.replaying .leaf-right { animation: leaf-open .9s 2.05s cubic-bezier(.2, .8, .25, 1.2) forwards; }
    .scene.replaying .petal { animation: petal-open 1.15s var(--replay-delay) cubic-bezier(.18, .8, .22, 1.15) forwards; }
    .scene.replaying .center-1 { animation: center-open .65s 4.75s cubic-bezier(.2, .8, .2, 1.2) forwards; }
    .scene.replaying .center-2 { animation: center-open .65s 4.9s cubic-bezier(.2, .8, .2, 1.2) forwards; }
    .scene.replaying .center-3 { animation: center-open .65s 5.05s cubic-bezier(.2, .8, .2, 1.2) forwards; }
    @keyframes draw-stem { to { stroke-dashoffset: 0; } }
    @keyframes leaf-open { to { opacity: 1; transform: scale(1); } }
    @keyframes petal-open { to { transform: scale(1); } }
    @keyframes center-open { to { transform: scale(1); } }
    @keyframes fade-up { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { from { opacity: .16; transform: scale(.75); } to { opacity: .8; transform: scale(1.3); } }

    @media (max-height: 700px) {
      .rose-wrap { width: min(60vh, 360px); margin-block: -18px; }
      .layout { padding-block: 0; }
      .replay { margin-top: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .stem-main, .stem-detail { stroke-dashoffset: 0; }
      .leaf { opacity: 1; transform: scale(1); }
      .petal, .flower-center { transform: scale(1); }
      .message, .replay { opacity: 1; }
    }

    body {
      background:
        radial-gradient(ellipse at 50% 54%, rgba(80, 14, 31, .12), transparent 35%),
        #030405;
    }

    .scene::before, .scene::after { display: none; }
    .rose-wrap > svg[role="img"] { display: none; }
    .rose-art {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 21 / 29;
      overflow: visible;
      filter: drop-shadow(0 0 16px rgba(235, 32, 63, .18));
    }
    .message { animation-delay: 5.9s; }
    .replay { animation-delay: 6.25s; }
  </style>
</head>

  <script>
    const canvas = document.getElementById("rose-art");
    const context = canvas.getContext("2d");
    const replayButton = document.getElementById("replay");
    const columns = 56;
    const rows = 58;
    const cellWidth = canvas.width / columns;
    const cellHeight = canvas.height / rows;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const red = ["#ac1734", "#d52042", "#f12e50", "#ff526d", "#ff8795"];
    const green = ["#13783d", "#18a64e", "#22ce5b", "#64f084", "#a4ffad"];
    const roseGlyphs = "0123456789@$%#*+=:.";
    const petalEdges = "/\\()[]{}";
    const leafGlyphs = "01|/\\~*+-.";
    let startedAt = performance.now();
    let animationFrame = 0;

    function clamp(value) {
      return Math.max(0, Math.min(1, value));
    }

    function ease(value) {
      const progress = clamp(value);
      return progress * progress * (3 - 2 * progress);
    }

    function pattern(x, y, seed) {
      const value = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453;
      return value - Math.floor(value);
    }

    function writeCell(x, y, character, color) {
      if (x < 0 || x >= columns || y < 0 || y >= rows) return;
      context.fillStyle = color;
      context.fillText(character, x * cellWidth, y * cellHeight + cellHeight * 0.78);
    }

    function drawStem(elapsed) {
      const progress = ease(elapsed / 1.65);
      const bottom = 52;
      const top = 26;
      const firstRow = Math.ceil(bottom - (bottom - top) * progress);

      for (let y = firstRow; y <= bottom; y++) {
        const height = (bottom - y) / (bottom - top);
        const x = Math.round(28 + Math.sin(height * Math.PI) * 0.8);
        const color = green[Math.floor(pattern(x, y, 4) * green.length)];
        writeCell(x, y, y % 4 === 0 ? "!" : y % 3 === 0 ? "|" : "1", color);
      }
    }

    function drawLeaf(anchorX, anchorY, direction, growth, seed) {
      if (growth <= 0) return;
      const length = Math.hypot(direction[0], direction[1]);
      const normalX = -direction[1] / length;
      const normalY = direction[0] / length;
      const reach = Math.ceil(length * growth + 2);

      for (let y = anchorY - reach; y <= anchorY + reach; y++) {
        for (let x = anchorX - reach; x <= anchorX + reach; x++) {
          const dx = x - anchorX;
          const dy = y - anchorY;
          const along = (dx * direction[0] + dy * direction[1]) / (length * length * growth);
          if (along < 0 || along > 1) continue;

          const across = (dx * normalX + dy * normalY) / (2.1 * Math.sin(Math.PI * along) * growth + .12);
          if (Math.abs(across) > 1) continue;

          const vein = Math.abs(across) < .12;
          const glyph = vein
            ? along > .85 ? ">" : "-"
            : leafGlyphs[Math.floor(pattern(x, y, seed) * leafGlyphs.length)];
          const colorIndex = vein ? 3 : 1 + Math.floor(pattern(x, y, seed + 2) * 3);
          writeCell(x, y, glyph, green[colorIndex]);
        }
      }
    }

    function makePetals(elapsed, start, count, ringX, ringY, radiusX, radiusY, seed, layer) {
      const petals = [];
      for (let index = 0; index < count; index++) {
        const progress = ease((elapsed - start - index * .075) / 1.05);
        if (progress <= 0) continue;

        const angle = -Math.PI / 2 + index * Math.PI * 2 / count;
        const spread = .22 + progress * .78;
        petals.push({
          x: 28 + Math.cos(angle) * ringX * spread,
          y: 17 + Math.sin(angle) * ringY * spread,
          rx: radiusX * spread,
          ry: radiusY * spread,
          angle,
          layer,
          seed: seed + index,
        });
      }
      return petals;
    }

    function drawBloom(elapsed) {
      if (elapsed < 2.2) {
        const budGrowth = ease((elapsed - 1.75) / .55);
        if (budGrowth > 0) {
          for (let y = 16; y <= 21; y++) {
            for (let x = 26; x <= 30; x++) {
              const distance = ((x - 28) / (1.2 + budGrowth)) ** 2
                + ((y - 19) / (2.2 + budGrowth)) ** 2;
              if (distance <= 1) writeCell(x, y, roseGlyphs[(x + y) % roseGlyphs.length], red[2]);
            }
          }
        }
        return;
      }

      const petals = [
        ...makePetals(elapsed, 2.2, 9, 9.1, 2.8, 6.8, 4.7, 0, 0),
        ...makePetals(elapsed, 3.15, 7, 5, 1.8, 5, 3.8, 20, 1),
        ...makePetals(elapsed, 4.0, 5, 2.5, 1, 3.3, 2.9, 40, 2),
      ];

      for (let y = 7; y <= 29; y++) {
        for (let x = 12; x <= 44; x++) {
          let selected = null;
          let depth = -1;
          for (const petal of petals) {
            const dx = x - petal.x;
            const dy = y - petal.y;
            const rotatedX = dx * Math.cos(petal.angle) + dy * Math.sin(petal.angle);
            const rotatedY = -dx * Math.sin(petal.angle) + dy * Math.cos(petal.angle);
            const distance = (rotatedX / petal.rx) ** 2 + (rotatedY / petal.ry) ** 2;
            if (distance <= 1 && petal.layer * 2 + (1 - distance) > depth) {
              selected = { ...petal, distance };
              depth = petal.layer * 2 + (1 - distance);
            }
          }
          if (!selected) continue;

          const contour = selected.distance > .8;
          const highlight = pattern(x, y, selected.seed) > .84;
          const colorIndex = contour ? 3 : highlight ? 4 : selected.layer > 0 ? 2 : 1;
          const glyphIndex = Math.floor(pattern(x, y, selected.seed + 8) * roseGlyphs.length);
          const glyph = contour
            ? petalEdges[glyphIndex % petalEdges.length]
            : roseGlyphs[glyphIndex];
          writeCell(x, y, glyph, red[colorIndex]);
        }
      }

      if (elapsed > 4.45) {
        const centerProgress = ease((elapsed - 4.45) / .65);
        for (let angle = 0; angle < centerProgress * Math.PI * 5; angle += .24) {
          const radius = .22 + angle * .17;
          const x = Math.round(28 + Math.cos(angle) * radius);
          const y = Math.round(17 + Math.sin(angle) * radius * .72);
          writeCell(x, y, roseGlyphs[(Math.floor(angle * 2) + 10) % roseGlyphs.length], red[4]);
        }
        if (centerProgress > 0) writeCell(28, 17, "@", "#ffd0a0");
      }
    }

    function render(elapsed) {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.font = "bold 15px 'Courier New', monospace";
      context.textAlign = "left";
      context.textBaseline = "alphabetic";

      drawStem(elapsed);
      drawLeaf(28, 42, [-11, -3], ease((elapsed - 1.55) / .85), 7);
      drawLeaf(28, 36, [10, -5], ease((elapsed - 1.85) / .85), 12);
      drawBloom(elapsed);
    }

    function animate(now) {
      const elapsed = reducedMotion ? 7 : (now - startedAt) / 1000;
      render(elapsed);
      if (!reducedMotion && elapsed < 6.2) {
        animationFrame = requestAnimationFrame(animate);
      }
    }

    function replay() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      startedAt = performance.now();
      animationFrame = requestAnimationFrame(animate);
    }

    replayButton.addEventListener("click", replay);
    replay();
  </script>
</body>
</html>
